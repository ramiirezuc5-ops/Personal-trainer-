# Configuración de despliegue para Netlify.
# La app vive en personal-trainer-app/client; "base" en este archivo raíz
# sobrescribe el directorio base configurado en el panel de Netlify.
# Reenvía /api/* al backend (Render) y sirve el resto como aplicación de una sola página.

[build]
  base = "personal-trainer-app/client"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://TU-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
